; Generic ESP32 4MB / ILI9488 480x320, independent theme partition.
[platformio]
default_envs = vehicle
[env]
platform = espressif32 @ 7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions_theme.csv
platform_packages = espressif/toolchain-xtensa-esp32 @ 8.4.0+2021r2-patch5
build_flags = -DCORE_DEBUG_LEVEL=1 -DOBD_DISPLAY_TFT=1 -DOBD_AUTO_ADAPT=1 -DOBD_SUPPORT_PROBE=1 -DOBD_TEST_PAGE_CYCLE_MS=0
[env:vehicle]
[env:simulation]
build_flags = ${env.build_flags} -DOBD_TRANSPORT=1 -DOBD_DATA_TEST=1
